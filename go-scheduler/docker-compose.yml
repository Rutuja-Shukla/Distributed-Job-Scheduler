version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: scheduler-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: scheduler
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scheduler"]
      interval: 3s
      timeout: 3s
      retries: 5

  migrate:
    image: migrate/migrate:v4.17.0
    container_name: scheduler-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://postgres:postgrespassword@postgres:5432/scheduler?sslmode=disable
      - up

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: scheduler-server
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      DATABASE_URL: "postgres://postgres:postgrespassword@postgres:5432/scheduler?sslmode=disable"
      HTTP_PORT: "8080"
      GRPC_PORT: "50051"

  worker-1:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: scheduler-worker-1
    depends_on:
      server:
        condition: service_started
    environment:
      DATABASE_URL: "postgres://postgres:postgrespassword@postgres:5432/scheduler?sslmode=disable"
      WORKER_ID: "worker-prod-1"
      CONCURRENCY: "8"
      QUEUE: "default"

  worker-2:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: scheduler-worker-2
    depends_on:
      server:
        condition: service_started
    environment:
      DATABASE_URL: "postgres://postgres:postgrespassword@postgres:5432/scheduler?sslmode=disable"
      WORKER_ID: "worker-prod-2"
      CONCURRENCY: "8"
      QUEUE: "default"

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: scheduler-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

volumes:
  pgdata:
